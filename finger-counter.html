<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finger Counter</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#2a3140;
    --ink:#e8ecf1; --sub:#8b95a5; --accent:#4fd1c5; --accent2:#f5a623;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  body{
    margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:16px;
  }
  h1{font-size:1.1rem;font-weight:600;margin:4px 0 0;letter-spacing:.2px}
  .sub{color:var(--sub);font-size:.85rem;margin:0 0 4px;text-align:center}
  .stage{
    position:relative;width:100%;max-width:640px;aspect-ratio:4/3;
    background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  }
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{transform:scaleX(-1)}
  #count{
    position:absolute;top:10px;left:10px;background:rgba(13,17,23,.72);
    backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:10px;
    padding:6px 14px;font-size:2rem;font-weight:700;color:var(--accent);
    min-width:52px;text-align:center;
  }
  #count small{display:block;font-size:.6rem;font-weight:500;color:var(--sub);letter-spacing:.3px}
  #hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--sub);font-size:.9rem;text-align:center;padding:20px;
  }
  #status{
    position:absolute;bottom:10px;right:10px;font-size:.7rem;color:var(--sub);
    background:rgba(13,17,23,.72);padding:4px 8px;border-radius:6px;border:1px solid var(--line);
  }
  button{
    background:var(--accent);color:#052b28;border:none;border-radius:10px;
    padding:10px 20px;font-size:.9rem;font-weight:600;cursor:pointer;
  }
  button:disabled{opacity:.5;cursor:default}
  button:active{transform:scale(.97)}
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){--bg:#f4f1ea;--panel:#fff;--line:#ddd6c8;--ink:#1b1b1b;--sub:#6b6b6b}
  }

  /* --- Credit / social section --- */
  .credit{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    margin-top:8px;padding:20px 16px;
  }
  .avatar-wrap{
    width:88px;height:88px;border-radius:50%;padding:3px;
    background:conic-gradient(from 0deg,#ff2d75,#ff8a00,#ffe600,#3dff8a,#00e5ff,#7a5cff,#ff2d75);
  }
  .avatar-wrap img{
    width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;
    border:3px solid var(--bg);
  }
  .dev-name{
    font-size:1rem;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,#ff2d75,#ffe600,#00e5ff,#7a5cff,#ff2d75);
    background-size:300% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:hue 4s linear infinite;
  }
  @keyframes hue{to{background-position:300% center}}
  .social-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .social-btn{
    display:flex;align-items:center;gap:7px;
    padding:9px 16px;border-radius:999px;
    background:rgba(255,255,255,.03);
    border:1.5px solid transparent;
    color:var(--ink);text-decoration:none;font-size:.82rem;font-weight:600;
    background-image:linear-gradient(var(--bg),var(--bg)),
      linear-gradient(120deg,#ff2d75,#ffe600,#00e5ff,#7a5cff,#ff2d75);
    background-origin:border-box;background-clip:padding-box,border-box;
    background-size:100% 100%,300% 100%;
    transition:transform .15s ease, box-shadow .2s ease, background-position .6s ease;
  }
  .social-btn:hover{
    transform:translateY(-2px);
    background-position:0 0,100% 0;
    box-shadow:0 0 14px -2px rgba(0,229,255,.6), 0 0 14px -2px rgba(255,45,117,.5);
  }
  .social-btn svg{width:16px;height:16px;flex:none}
</style>
</head>
<body>
<h1>Finger Counter</h1>
<p class="sub">Hold one hand up to the camera. Raised fingers are counted live.</p>
<div class="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="count"><span id="n">–</span><small>fingers</small></div>
  <div id="hint">Tap start to allow camera access</div>
  <div id="status"></div>
</div>
<button id="startBtn">Start camera</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const nEl = document.getElementById('n');
const hint = document.getElementById('hint');
const status = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

const FINGERS = {
  index:  {mcp:5,  pip:6,  tip:8},
  middle: {mcp:9,  pip:10, tip:12},
  ring:   {mcp:13, pip:14, tip:16},
  pinky:  {mcp:17, pip:18, tip:20}
};

function dist(a, b){
  return Math.hypot(a.x-b.x, a.y-b.y, (a.z||0)-(b.z||0));
}
// angle at vertex b, formed by rays b->a and b->c, in degrees
function angleAt(a, b, c){
  const v1 = {x:a.x-b.x, y:a.y-b.y, z:(a.z||0)-(b.z||0)};
  const v2 = {x:c.x-b.x, y:c.y-b.y, z:(c.z||0)-(b.z||0)};
  const dot = v1.x*v2.x + v1.y*v2.y + v1.z*v2.z;
  const mag = Math.hypot(v1.x,v1.y,v1.z) * Math.hypot(v2.x,v2.y,v2.z);
  if (mag === 0) return 180;
  return Math.acos(Math.min(1, Math.max(-1, dot/mag))) * 180/Math.PI;
}

// Rotation-invariant: doesn't rely on y-position or handedness, so it holds
// whether the hand is tilted, sideways, upside down, or handedness is misread.
function countFingers(lm){
  const wrist = lm[0];
  const handScale = dist(wrist, lm[9]) || 1; // wrist -> middle MCP, scales with hand size/distance from camera
  let count = 0;

  for (const f in FINGERS){
    const {mcp, pip, tip} = FINGERS[f];
    const straight = angleAt(lm[mcp], lm[pip], lm[tip]) > 155; // finger not curled at the knuckle
    const reaching = dist(wrist, lm[tip]) > dist(wrist, lm[pip]) + 0.02 * handScale; // tip further out than pip
    if (straight && reaching) count++;
  }

  // Thumb: distance-based instead of left/right-dependent, so mirrored video
  // or a flipped handedness label can't flip the result.
  const thumbSpread = dist(lm[4], lm[17]) / handScale; // thumb tip vs pinky-knuckle, scaled
  if (thumbSpread > 1.0) count++;

  return count;
}

// Smooth over recent frames to kill single-frame flicker/misreads
const history = [];
const HISTORY_LEN = 6;
function smooth(value){
  history.push(value);
  if (history.length > HISTORY_LEN) history.shift();
  const counts = {};
  let best = value, bestN = 0;
  history.forEach(v => {
    counts[v] = (counts[v]||0) + 1;
    if (counts[v] > bestN){ bestN = counts[v]; best = v; }
  });
  return best;
}

function onResults(results){
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  ctx.save();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1); // mirror to match mirrored video

  if (results.multiHandLandmarks && results.multiHandLandmarks.length){
    hint.style.display = 'none';
    let total = 0;
    results.multiHandLandmarks.forEach((lm)=>{
      window.drawConnectors(ctx, lm, window.HAND_CONNECTIONS, {color:'#4fd1c5', lineWidth:3});
      window.drawLandmarks(ctx, lm, {color:'#f5a623', lineWidth:1, radius:3});
      total += countFingers(lm);
    });
    nEl.textContent = smooth(total);
    status.textContent = results.multiHandLandmarks.length + ' hand(s) tracked';
  } else {
    nEl.textContent = '–';
    status.textContent = 'no hand detected';
  }
  ctx.restore();
}

let camera;
startBtn.addEventListener('click', async ()=>{
  startBtn.disabled = true;
  startBtn.textContent = 'Starting…';
  try{
    const hands = new window.Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });
    hands.onResults(onResults);

    camera = new window.Camera(video, {
      onFrame: async ()=>{ await hands.send({image:video}); },
      width: 640,
      height: 480
    });
    await camera.start();
    startBtn.style.display = 'none';
  }catch(err){
    hint.textContent = 'Camera access failed: ' + err.message;
    startBtn.disabled = false;
    startBtn.textContent = 'Try again';
  }
});
</script>
